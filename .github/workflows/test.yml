name: Tests

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - noxfile.py
      - pyproject.toml
      - .github/workflows/test.yml
      - .github/workflows/resources/constraints.txt
  push:
    branches: [v_2_16]
    paths:
      - src/**
      - tests/**
      - noxfile.py
      - pyproject.toml
      - .github/workflows/test.yml
      - .github/workflows/resources/constraints.txt
  workflow_dispatch:
    inputs: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    # gopuff runs meltano on Python 3.12 (pyproject caps python <3.13) with a Postgres system database.
    name: "Pytest on py3.12 (DB: postgresql)"
    runs-on: ubuntu-latest
    env:
      PYTEST_MARKERS: not concurrent
      FORCE_COLOR: 1
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/workflows/resources/constraints.txt

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -d postgres -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Setup Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'poetry.lock'

    - name: Install Poetry and Nox
      run: |
        pipx install poetry
        pipx install nox
        pipx inject nox nox-poetry
        poetry --version

    - name: Run pytest
      env:
        COLUMNS: 160
        PYTEST_BACKEND: postgresql
        POSTGRES_HOST_AUTH_METHOD: trust
        POSTGRES_ADDRESS: localhost
        POSTGRES_PORT: 5432
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: pytest_warehouse
      run: nox -rs tests --python=3.12 -- -m "${{ env.PYTEST_MARKERS }}"

